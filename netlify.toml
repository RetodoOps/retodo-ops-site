[build]
  publish = "tms"

[functions]
  directory = "netlify/functions"

[functions."file-lifecycle-scheduler"]
  schedule = "@daily"

[functions."file-lifecycle-worker-background"]
  background = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
