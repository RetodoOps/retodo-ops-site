<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quotes — RetodoOps TMS</title><link rel="stylesheet" href="style.css?v=019"></head>
<body><div class="app">
<aside class="sidebar"><div class="sidebar-brand"><div class="b-name">RetodoOps</div><div class="b-sub">TMS</div></div><nav class="nav">

</nav></aside>
<main class="main"><div class="module-header"><div><h1>Quotes</h1><p>Commercial offers before client confirmation</p></div><button class="btn-primary" onclick="openQuoteModal()">+ Create quote</button></div>
<div class="toolbar"><input class="search-box" id="quoteSearch" type="search" placeholder="Search quotes…"><select class="toolbar-select" id="quoteStatus"><option value="">All statuses</option><option>Draft</option><option>Awaiting Client</option><option>Revision Requested</option><option>Accepted</option><option>Declined</option><option>Expired</option><option>Cancelled</option></select><div class="toolbar-right"><span id="quoteCount" class="record-count"></span></div></div>
<div class="table-wrap"><table class="module-table quotes-table"><thead><tr><th>Quote</th><th>Client</th><th>Account</th><th>Reference</th><th>Targets</th><th>Status</th><th>Valid until</th><th>Total</th><th>Created</th></tr></thead><tbody id="quotesTbody"><tr class="state-row"><td colspan="9">Loading quotes…</td></tr></tbody></table></div></main></div>

<div id="quoteModal" class="modal-overlay hidden"><div class="modal"><div class="modal-header"><h3>Create quote</h3><button class="modal-close" onclick="closeQuoteModal()">×</button></div><div class="modal-body"><div class="form-grid form-grid-3">
<div class="field field-span-2"><label>Client *</label><select id="q-client"></select></div><div class="field"><label>Account</label><select id="q-account"></select></div>
<div class="field"><label>Contact</label><select id="q-contact"></select></div><div class="field field-span-2"><label>Billing entity</label><select id="q-billing"></select></div>
<div class="field field-span-2"><label>Title</label><input id="q-title" placeholder="Short description of the request"></div><div class="field"><label>Client reference</label><input id="q-reference"></div>
<div class="field"><label>Email reference</label><input id="q-email-ref" placeholder="Subject or Gmail link"></div><div class="field"><label>Source language</label><input id="q-source" value="English"></div><div class="field"><label>Currency</label><select id="q-currency"><option>EUR</option><option>USD</option><option>GBP</option><option>NOK</option><option>SEK</option><option>DKK</option><option>CHF</option></select></div>
<div class="field"><label>Requested delivery date</label><input id="q-deadline-date" type="date"></div><div class="field"><label>Requested delivery time</label><input id="q-deadline-time" type="time" step="60"></div><div class="field"><label>Valid until</label><input id="q-valid" type="date"></div>
</div><p id="quoteCreateError" class="error-msg hidden"></p></div><div class="modal-footer"><button class="btn-secondary" onclick="closeQuoteModal()">Cancel</button><button class="btn-primary" id="createQuoteBtn" onclick="createQuote()">Create quote</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=019"></script><script src="auth.js?v=019"></script><script src="quick-nav.js?v=019"></script><script src="quotes.js?v=019"></script></body></html>
