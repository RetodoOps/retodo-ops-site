<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetodoOps TMS — Reset Password</title>
    <link rel="stylesheet" href="style.css?v=039">
</head>
<body class="login-body">

<div class="login-card">
    <div class="login-brand">
        <h1>Choose a new password</h1>
        <p>RetodoOps TMS</p>
    </div>
    <form id="newPasswordForm">
        <div class="field">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" minlength="12"
                   autocomplete="new-password" required>
            <small class="field-help">Use at least 12 characters.</small>
        </div>
        <div class="field">
            <label for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" minlength="12"
                   autocomplete="new-password" required>
        </div>
        <p id="passwordMessage" class="auth-message hidden" role="status" aria-live="polite"></p>
        <button type="submit" class="btn-primary btn-full" id="savePasswordBtn">Save new password</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js?v=042"></script>
<script>
    const form = document.getElementById('newPasswordForm');
    const message = document.getElementById('passwordMessage');
    const button = document.getElementById('savePasswordBtn');
    const PASSWORD_SESSION_KEY = 'tms-password-session-user';
    let passwordSaved = false;

    function showPasswordError(error) {
        const detail = String(error?.message || error || '').trim();
        const invalidLink = !detail || /expired|invalid.*(?:token|link|otp)|(?:token|session).*(?:invalid|missing|expired)|no.*session/i.test(detail);
        message.textContent = invalidLink
            ? 'This reset link is invalid or has expired. Request a new link from the sign-in page.'
            : `Password could not be saved: ${detail}`;
        message.className = 'error-msg';
    }

    function clearAuthCallbackUrl() {
        history.replaceState(null, document.title, location.pathname);
    }

    async function establishPasswordSession() {
        const hashParams = new URLSearchParams(location.hash.replace(/^#/, ''));
        const queryParams = new URLSearchParams(location.search);
        const callbackError = hashParams.get('error_description') || queryParams.get('error_description');

        if (callbackError) throw new Error(callbackError.replace(/\+/g, ' '));

        const accessToken = hashParams.get('access_token');
        const refreshToken = hashParams.get('refresh_token');
        if (accessToken && refreshToken) {
            const {data, error} = await _sb.auth.setSession({
                access_token: accessToken,
                refresh_token: refreshToken,
            });
            if (error) throw error;
            if (!data.session?.user) throw new Error('Auth session missing');
            sessionStorage.setItem(PASSWORD_SESSION_KEY, data.session.user.id);
            clearAuthCallbackUrl();
            return data.session;
        }

        const code = queryParams.get('code');
        if (code) {
            const {data, error} = await _sb.auth.exchangeCodeForSession(code);
            if (error) throw error;
            if (!data.session?.user) throw new Error('Auth session missing');
            sessionStorage.setItem(PASSWORD_SESSION_KEY, data.session.user.id);
            clearAuthCallbackUrl();
            return data.session;
        }

        const expectedUserId = sessionStorage.getItem(PASSWORD_SESSION_KEY);
        if (!expectedUserId) return null;

        const {data: {session}, error} = await _sb.auth.getSession();
        if (error) throw error;
        return session?.user?.id === expectedUserId ? session : null;
    }

    async function openWorkspace() {
        button.disabled = true;
        button.textContent = 'Opening workspace…';
        try {
            if (!await accessIsEnabled()) {
                throw new Error('access-not-ready');
            }

            const role = await currentAppRole(true);
            let destination;
            if (role === 'resource') destination = 'resource-dashboard.html';
            else if (TMS_COMPANY_ROLES.has(role)) destination = 'dashboard.html';
            else throw new Error('role-not-ready');

            sessionStorage.removeItem(PASSWORD_SESSION_KEY);
            message.textContent = 'Password saved. Opening your workspace…';
            message.className = 'auth-message success';
            location.replace(destination);
            return true;
        } catch (error) {
            const reason = error?.message === 'access-not-ready'
                ? 'Access is not active for this account yet.'
                : error?.message === 'role-not-ready'
                    ? 'The account does not have a supported TMS role yet.'
                    : 'The access check could not be completed.';
            message.textContent = `Password saved, but the workspace could not be opened. ${reason} Keep this page open and retry.`;
            message.className = 'error-msg';
            button.disabled = false;
            button.textContent = 'Retry opening workspace';
            return false;
        }
    }

    button.disabled = true;
    button.textContent = 'Checking link…';
    const passwordSession = establishPasswordSession()
        .then(session => {
            if (!session) throw new Error('Auth session missing');
            button.disabled = false;
            button.textContent = 'Save new password';
            return session;
        })
        .catch(error => {
            showPasswordError(error);
            button.disabled = true;
            button.textContent = 'Link unavailable';
            return null;
        });

    form.addEventListener('submit', async event => {
        event.preventDefault();
        if (passwordSaved) {
            await openWorkspace();
            return;
        }

        const password = document.getElementById('newPassword').value;
        const confirmation = document.getElementById('confirmPassword').value;

        if (password !== confirmation) {
            message.textContent = 'The passwords do not match.';
            message.className = 'error-msg';
            return;
        }

        const session = await passwordSession;
        if (!session) return;

        button.disabled = true;
        button.textContent = 'Saving…';

        const { error } = await updatePassword(password);
        if (error) {
            showPasswordError(error);
            button.disabled = false;
            button.textContent = 'Save new password';
            return;
        }

        passwordSaved = true;
        document.getElementById('newPassword').disabled = true;
        document.getElementById('confirmPassword').disabled = true;
        await openWorkspace();
    });
</script>

</body>
</html>
