<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetodoOps TMS — Reset Password</title>
    <link rel="stylesheet" href="style.css?v=019">
</head>
<body class="login-body">

<div class="login-card">
    <div class="login-brand">
        <h1>Choose a new password</h1>
        <p>RetodoOps TMS</p>
    </div>
    <form id="newPasswordForm">
        <div class="field">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" minlength="12"
                   autocomplete="new-password" required>
            <small class="field-help">Use at least 12 characters.</small>
        </div>
        <div class="field">
            <label for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" minlength="12"
                   autocomplete="new-password" required>
        </div>
        <p id="passwordMessage" class="auth-message hidden" role="status" aria-live="polite"></p>
        <button type="submit" class="btn-primary btn-full" id="savePasswordBtn">Save new password</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
    const form = document.getElementById('newPasswordForm');
    const message = document.getElementById('passwordMessage');

    form.addEventListener('submit', async event => {
        event.preventDefault();
        const password = document.getElementById('newPassword').value;
        const confirmation = document.getElementById('confirmPassword').value;

        if (password !== confirmation) {
            message.textContent = 'The passwords do not match.';
            message.className = 'error-msg';
            return;
        }

        const button = document.getElementById('savePasswordBtn');
        button.disabled = true;
        button.textContent = 'Saving…';

        const { error } = await updatePassword(password);
        if (error) {
            message.textContent = 'This reset link is invalid or has expired. Request a new link from the sign-in page.';
            message.className = 'error-msg';
            button.disabled = false;
            button.textContent = 'Save new password';
            return;
        }

        message.textContent = 'Password updated. Redirecting to the dashboard…';
        message.className = 'auth-message success';
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
    });
</script>

</body>
</html>
